%% Definitions/conference.cfg -- conference data for the CroCEE template
%% Edit this file for a new edition of the conference (and replace the
%% logo in Figures/). Nothing else in the template has to change.
\croceeconference{
  edition   = 4,                        % number of the conference
  ordinal   = th,                       % suffix: st, nd, rd, th
  name      = {Croatian Conference on Earthquake Engineering},
  acronym   = CroCEE,
  short     = 4CroCEE,                  % used in the header and in the texts
  dates     = {22--25 March 2027},
  place     = {Opatija, Croatia},
  year      = 2027,
  copyright = CroCEE,                   % "Copyright (c) <year> <copyright>"
  logo      = Figures/4CroCEE_logo,     % header logo, .png or .pdf, 2.4 x 1.5 cm
}
